<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Страница не найдена — olcOS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/site.css">
  <style>
    .nf { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 48px 20px; position: relative; overflow: hidden; }
    .nf::before { content: ""; position: absolute; inset: -20% -10% auto; height: 70%; background: radial-gradient(closest-side at 50% 50%, rgba(110, 155, 255, 0.16), transparent 70%); pointer-events: none; }
    .nf-card { position: relative; max-width: 560px; text-align: center; }
    .nf-icon { width: 88px; height: 88px; border-radius: 22px; margin: 0 auto 28px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1), 0 24px 60px -20px rgba(31, 95, 255, 0.7); }
    .nf-code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: #6e9bff; margin: 0 0 14px; }
    .nf h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 14px; }
    .nf p.sub { color: var(--text-2, #a7aab3); font-size: 17px; line-height: 1.55; margin: 0 0 30px; }
    .nf p.sub + p.sub { margin-top: -18px; font-size: 15px; }
    .nf-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  </style>
</head>
<body>
<main class="nf">
  <div class="nf-card">
    <img class="nf-icon" src="/assets/icon-192.png" width="88" height="88" alt="olcOS">
    <p class="nf-code">Ошибка 404</p>
    <h1>Такой страницы нет</h1>
    <p class="sub">Возможно, ссылка устарела или в адресе опечатка. Всё про olcOS есть на главной.</p>
    <p class="sub" lang="en">This page doesn't exist. Everything about olcOS is on the home page.</p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="/">На главную</a>
      <a class="btn btn-secondary" href="/en/" hreflang="en" lang="en">English</a>
      <a class="btn btn-secondary" href="https://github.com/olcOS/olcos/releases/latest">Скачать</a>
    </div>
  </div>
</main>
</body>
</html>
